<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pontshoOS — admin</title>
<style>
  html,body{margin:0;padding:0;background:#0b0a09;color:#ece7e1;font-family:system-ui,sans-serif;}
  *{box-sizing:border-box;}
  .wrap{max-width:920px;margin:0 auto;padding:40px 24px 100px;}
  h1{font-size:22px;font-weight:700;margin:0 0 4px;}
  h2{font-size:16px;font-weight:700;margin:36px 0 12px;color:#e8a06a;}
  .hint{font-size:13px;color:rgba(236,231,225,.55);margin-bottom:24px;}
  .card{border:1px solid rgba(255,255,255,.1);border-radius:12px;background:rgba(255,255,255,.03);padding:16px 18px;margin-bottom:14px;}
  label{display:block;font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:rgba(236,231,225,.5);margin:10px 0 4px;}
  label:first-child{margin-top:0;}
  input,textarea{width:100%;background:#141210;border:1px solid rgba(255,255,255,.14);border-radius:8px;color:#f4efe9;font:inherit;font-size:14px;padding:8px 10px;}
  textarea{min-height:70px;resize:vertical;font-family:inherit;}
  .row{display:flex;gap:10px;}
  .row > div{flex:1;}
  .linkrow{display:flex;gap:8px;margin-bottom:6px;}
  .linkrow input{flex:1;}
  button{font:inherit;cursor:pointer;}
  .btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#ece7e1;border-radius:8px;padding:8px 14px;font-size:13px;}
  .btn:hover{background:rgba(255,255,255,.14);}
  .btn-danger{background:rgba(217,60,60,.15);border-color:rgba(217,60,60,.3);color:#f0a8a8;}
  .btn-danger:hover{background:rgba(217,60,60,.28);}
  .btn-primary{background:#e8863c;border-color:#e8863c;color:#221f19;font-weight:700;}
  .btn-primary:hover{background:#f4a05e;}
  .card-head{display:flex;justify-content:space-between;align-items:center;}
  .card-head strong{font-size:14px;}
  .toolbar{position:sticky;top:0;background:rgba(11,10,9,.9);backdrop-filter:blur(10px);padding:12px 0;margin-bottom:8px;display:flex;gap:10px;align-items:center;border-bottom:1px solid rgba(255,255,255,.08);z-index:5;}
  .status{font-size:13px;}
  .status.ok{color:#8ec07c;}
  .status.err{color:#f0a8a8;white-space:pre-wrap;}
</style>
</head>
<body>
<div class="wrap">
  <h1>pontshoOS admin</h1>
  <div class="hint">Editing <code>content.json</code> — changes go live on the site as soon as you save. Reload discards unsaved edits.</div>

  <div class="toolbar">
    <button class="btn btn-primary" id="save-btn" onclick="saveAll()">Save all changes</button>
    <button class="btn" onclick="reloadContent()">Reload from server</button>
    <span class="status" id="status"></span>
  </div>

  <h2>Projects <button class="btn" onclick="addProject()">+ Add project</button></h2>
  <div id="projects"></div>

  <h2>Blog posts <button class="btn" onclick="addPost()">+ Add post</button></h2>
  <div id="posts"></div>

  <h2>Skills</h2>
  <div class="card">
    <label>Comma-separated list</label>
    <input id="skills-input" oninput="onSkillsInput(event)">
  </div>

  <h2>Contact</h2>
  <div class="card">
    <div class="row">
      <div><label>Email</label><input id="contact-email" oninput="onContactInput('email', event)"></div>
      <div><label>GitHub</label><input id="contact-github" oninput="onContactInput('github', event)"></div>
      <div><label>LinkedIn</label><input id="contact-linkedin" oninput="onContactInput('linkedin', event)"></div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";
  var content = { projects: [], posts: [], skills: [], contact: { email: '', github: '', linkedin: '' } };

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function linesToArray(s) { return String(s || '').split('\n').map(function (l) { return l.trim(); }).filter(Boolean); }
  function csvToArray(s) { return String(s || '').split(',').map(function (l) { return l.trim(); }).filter(Boolean); }

  function setStatus(msg, cls) {
    var el = document.getElementById('status');
    el.textContent = msg;
    el.className = 'status' + (cls ? ' ' + cls : '');
  }

  function reloadContent() {
    setStatus('Loading…');
    fetch('/content.json', { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function (data) {
      content = {
        projects: Array.isArray(data.projects) ? data.projects : [],
        posts: Array.isArray(data.posts) ? data.posts : [],
        skills: Array.isArray(data.skills) ? data.skills : [],
        contact: data.contact || { email: '', github: '', linkedin: '' }
      };
      renderAll();
      setStatus('Loaded.', 'ok');
    }).catch(function (e) { setStatus('Failed to load content.json: ' + e.message, 'err'); });
  }

  // ---- Projects ----
  function renderProjects() {
    var el = document.getElementById('projects');
    el.innerHTML = content.projects.map(function (p, i) {
      var linksHtml = (p.links || []).map(function (lk, li) {
        return '<div class="linkrow">'
          + '<input placeholder="Label" value="' + esc(lk.label) + '" oninput="onLinkField(' + i + ',' + li + ',\'label\',event)">'
          + '<input placeholder="https://…" value="' + esc(lk.url) + '" oninput="onLinkField(' + i + ',' + li + ',\'url\',event)">'
          + '<button class="btn btn-danger" onclick="removeLink(' + i + ',' + li + ')">&times;</button></div>';
      }).join('');
      return '<div class="card">'
        + '<div class="card-head"><strong>' + esc(p.name || '(new project)') + '</strong>'
        + '<button class="btn btn-danger" onclick="removeProject(' + i + ')">Remove</button></div>'
        + '<div class="row"><div><label>ID (slug, lowercase-hyphenated)</label><input value="' + esc(p.id) + '" oninput="onProjField(' + i + ',\'id\',event)"></div>'
        + '<div><label>Year</label><input value="' + esc(p.year) + '" oninput="onProjField(' + i + ',\'year\',event)"></div></div>'
        + '<div class="row"><div><label>Short name (dock/icon)</label><input value="' + esc(p.name) + '" oninput="onProjField(' + i + ',\'name\',event)"></div>'
        + '<div><label>Full title</label><input value="' + esc(p.full) + '" oninput="onProjField(' + i + ',\'full\',event)"></div></div>'
        + '<div class="row"><div><label>Color (hex, e.g. #e8863c)</label><input value="' + esc(p.color) + '" oninput="onProjField(' + i + ',\'color\',event)"></div>'
        + '<div><label>Icon label (1-4 chars, fallback if no favicon)</label><input value="' + esc(p.label) + '" oninput="onProjField(' + i + ',\'label\',event)"></div></div>'
        + '<label>Icon URL (optional — leave blank to auto-use the first link\'s /favicon.ico)</label><input value="' + esc(p.icon || '') + '" oninput="onProjField(' + i + ',\'icon\',event)">'
        + '<label>Tags (comma-separated)</label><input value="' + esc((p.tags || []).join(', ')) + '" oninput="onProjTags(' + i + ',event)">'
        + '<label>Description (one paragraph per line)</label><textarea oninput="onProjDesc(' + i + ',event)">' + esc((p.desc || []).join('\n')) + '</textarea>'
        + '<label>Highlights (one per line)</label><textarea oninput="onProjHighlights(' + i + ',event)">' + esc((p.highlights || []).join('\n')) + '</textarea>'
        + '<label>Links</label>' + linksHtml
        + '<button class="btn" onclick="addLink(' + i + ')">+ Add link</button>'
        + '</div>';
    }).join('') || '<div class="hint">No projects yet.</div>';
  }
  function addProject() {
    content.projects.push({ id: '', name: '', full: '', year: '', color: '#e8863c', label: '', tags: [], desc: [''], highlights: [], links: [] });
    renderProjects();
  }
  function removeProject(i) { content.projects.splice(i, 1); renderProjects(); }
  function onProjField(i, field, e) { content.projects[i][field] = e.target.value; if (field === 'name' || field === 'id') renderProjects(); }
  function onProjTags(i, e) { content.projects[i].tags = csvToArray(e.target.value); }
  function onProjDesc(i, e) { content.projects[i].desc = linesToArray(e.target.value); }
  function onProjHighlights(i, e) { content.projects[i].highlights = linesToArray(e.target.value); }
  function addLink(i) { content.projects[i].links = content.projects[i].links || []; content.projects[i].links.push({ label: '', url: '' }); renderProjects(); }
  function removeLink(i, li) { content.projects[i].links.splice(li, 1); renderProjects(); }
  function onLinkField(i, li, field, e) { content.projects[i].links[li][field] = e.target.value; }

  // ---- Posts ----
  function renderPosts() {
    var el = document.getElementById('posts');
    el.innerHTML = content.posts.map(function (p, i) {
      return '<div class="card">'
        + '<div class="card-head"><strong>' + esc(p.title || '(new post)') + '</strong>'
        + '<button class="btn btn-danger" onclick="removePost(' + i + ')">Remove</button></div>'
        + '<label>Title</label><input value="' + esc(p.title) + '" oninput="onPostField(' + i + ',\'title\',event)">'
        + '<div class="row"><div><label>Date (e.g. Jul 2026)</label><input value="' + esc(p.date) + '" oninput="onPostField(' + i + ',\'date\',event)"></div>'
        + '<div><label>Tag (e.g. Essay)</label><input value="' + esc(p.tag) + '" oninput="onPostField(' + i + ',\'tag\',event)"></div></div>'
        + '<label>Body (one paragraph per line)</label><textarea style="min-height:120px;" oninput="onPostPars(' + i + ',event)">' + esc((p.pars || []).join('\n')) + '</textarea>'
        + '</div>';
    }).join('') || '<div class="hint">No posts yet.</div>';
  }
  function addPost() {
    content.posts.unshift({ title: '', date: '', tag: '', pars: [''] });
    renderPosts();
  }
  function removePost(i) { content.posts.splice(i, 1); renderPosts(); }
  function onPostField(i, field, e) { content.posts[i][field] = e.target.value; if (field === 'title') renderPosts(); }
  function onPostPars(i, e) { content.posts[i].pars = linesToArray(e.target.value); }

  // ---- Skills / contact ----
  function onSkillsInput(e) { content.skills = csvToArray(e.target.value); }
  function onContactInput(field, e) { content.contact[field] = e.target.value; }

  function renderAll() {
    renderProjects();
    renderPosts();
    document.getElementById('skills-input').value = (content.skills || []).join(', ');
    document.getElementById('contact-email').value = content.contact.email || '';
    document.getElementById('contact-github').value = content.contact.github || '';
    document.getElementById('contact-linkedin').value = content.contact.linkedin || '';
  }

  function saveAll() {
    setStatus('Saving…');
    document.getElementById('save-btn').disabled = true;
    fetch('/admin/api/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(content)
    }).then(function (r) {
      return r.json().then(function (body) { return { ok: r.ok, body: body }; });
    }).then(function (res) {
      document.getElementById('save-btn').disabled = false;
      if (res.ok && res.body.ok) { setStatus('Saved.', 'ok'); }
      else { setStatus('Save failed: ' + (res.body.error || 'unknown error'), 'err'); }
    }).catch(function (e) {
      document.getElementById('save-btn').disabled = false;
      setStatus('Save failed: ' + e.message, 'err');
    });
  }

  window.addProject = addProject; window.removeProject = removeProject; window.onProjField = onProjField;
  window.onProjTags = onProjTags; window.onProjDesc = onProjDesc; window.onProjHighlights = onProjHighlights;
  window.addLink = addLink; window.removeLink = removeLink; window.onLinkField = onLinkField;
  window.addPost = addPost; window.removePost = removePost; window.onPostField = onPostField; window.onPostPars = onPostPars;
  window.onSkillsInput = onSkillsInput; window.onContactInput = onContactInput;
  window.saveAll = saveAll; window.reloadContent = reloadContent;

  reloadContent();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pontsho Mbizo — Electrical &amp; Computer Engineer</title>
<meta name="description" content="Pontsho Mbizo — Electrical &amp; Computer Engineer. FPGA logic, embedded firmware and hardware that works.">
<link rel="icon" type="image/png" href="favico.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;800&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#141414; --bg:#ffffff;
    --accent:#2B3650; --accent-hover:#3a4a6b;
    --tile:#E2E1DC; --ph:#DCDBD5; --ph-soft:#E4E3DE; --ph-mark:#B9B8B1;
    --muted:#55554F; --label:#45453F; --rule:#D4D3CD;
  }
  html,body{margin:0;padding:0;background:var(--bg);}
  *{box-sizing:border-box;}
  body{color:var(--ink);font-family:'Work Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  a{color:var(--ink);text-decoration:none;}
  a:hover{color:var(--accent-hover);}
  a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}
  ::selection{background:rgba(43,54,80,.18);}
  img{display:block;max-width:100%;}

  .page{min-height:100vh;display:flex;flex-direction:column;}

  /* Header */
  .site-header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 32px;padding:20px 40px;}
  .nav{display:flex;gap:40px;font-size:16px;font-weight:500;flex:1 1 260px;}
  .nav a{padding:12px 0 4px;}
  .nav a.is-active{border-bottom:2px solid var(--ink);padding-bottom:2px;}
  .brand{font-size:18px;font-weight:800;flex:0 0 auto;}
  .social{display:flex;gap:28px;justify-content:flex-end;flex:1 1 260px;font-size:15px;font-weight:600;}
  .social a{padding:12px 0;}

  /* Shared */
  .page-title{margin:0 0 32px;text-align:center;font-size:clamp(40px,6vw,56px);font-weight:800;letter-spacing:-.5px;line-height:1.1;}
  .btn{display:inline-flex;align-items:center;justify-content:center;width:240px;max-width:100%;min-height:44px;padding:0 16px;border-radius:10px 4px 10px 4px;background:var(--accent);color:#fff;font-size:15px;font-weight:600;letter-spacing:1px;text-transform:uppercase;transition:background .15s;}
  .btn:hover{background:var(--accent-hover);color:#fff;}
  .notice{margin:0 auto;max-width:560px;text-align:center;font-size:16px;line-height:1.6;color:var(--muted);}

  /* Home */
  .home{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:56px 24px 80px;}
  .home-inner{position:relative;z-index:1;width:100%;max-width:1360px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:56px;}
  .portrait{flex:1 1 360px;max-width:600px;aspect-ratio:1/.98;border-radius:40px;background:var(--ph-soft);overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .portrait img{width:100%;height:100%;object-fit:cover;}
  .intro{flex:1 1 440px;max-width:700px;position:relative;padding:72px 24px;text-align:center;}
  .intro h1{margin:0 0 32px;font-size:clamp(38px,5vw,56px);line-height:1.1;font-weight:800;letter-spacing:-.5px;position:relative;}
  .intro p{margin:0 auto 20px;max-width:590px;font-size:17px;line-height:1.6;position:relative;}
  .intro p:last-of-type{margin-bottom:40px;}
  .ctas{display:flex;flex-direction:column;align-items:center;gap:14px;position:relative;}
  /* Isometric drawings scattered behind the home page, kept mostly to the
     edges so they don't sit under the portrait or the headline. */
  .home-bg{position:absolute;inset:0;pointer-events:none;}
  .ornament{position:absolute;height:auto;opacity:.5;mix-blend-mode:multiply;}
  .ornament-quad{top:3%;left:1.5%;width:clamp(150px,14vw,270px);}
  .ornament-rover{bottom:3%;left:2%;width:clamp(140px,13.5vw,260px);}
  .ornament-enclosure{top:2%;right:2%;width:clamp(120px,11.5vw,220px);}
  .ornament-buoy{top:36%;right:1%;width:clamp(66px,6.25vw,120px);}
  .ornament-gantry{bottom:-2%;right:5%;width:clamp(170px,16.5vw,320px);}
  /* Narrower screens have no side margins, so the drawings end up behind
     the text; fade them further there. */
  @media (max-width:1500px){ .ornament{opacity:.22;} }

  /* Projects grid */
  .projects{width:100%;max-width:760px;margin:0 auto;padding:96px 24px 140px;}
  .tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:40px 36px;}
  .tile-col{flex:1 1 320px;max-width:340px;display:flex;flex-direction:column;}
  .tile-col-a{gap:64px;padding-top:24px;}
  .tile-col-b{gap:32px;}
  .tile{display:block;position:relative;color:var(--ink);}
  .tile:hover{color:var(--ink);}
  .tile:hover .tile-name{text-decoration:underline;text-underline-offset:3px;}
  .tile:hover .tile-media img{transform:scale(1.03);}
  .tile-cap{position:absolute;z-index:1;width:210px;padding:18px 14px;background:var(--tile);}
  .tile-name{font-size:18px;font-weight:800;}
  .tile-blurb{font-size:12px;margin-top:4px;line-height:1.4;}
  .tile-media{background:var(--ph);overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .tile-media img{width:100%;height:100%;object-fit:cover;transition:transform .3s;}
  .tile-mark{font-size:44px;font-weight:800;letter-spacing:-1px;color:var(--ph-mark);}
  .tile-a0{padding:60px 0 0 62px;}
  .tile-a0 .tile-media{height:306px;}
  .tile-a0 .tile-cap{top:0;left:0;min-height:60px;}
  .tile-a1{padding-bottom:36px;}
  .tile-a1 .tile-media{height:294px;width:240px;}
  .tile-a1 .tile-cap{bottom:0;left:62px;}
  .tile-a2{padding-left:62px;}
  .tile-a2 .tile-media{margin-top:40px;height:250px;}
  .tile-a2 .tile-cap{top:0;left:0;}
  .tile-b0{padding-bottom:24px;}
  .tile-b0 .tile-media{height:302px;}
  .tile-b0 .tile-cap{bottom:0;left:0;min-height:90px;}
  .tile-b1{padding-bottom:20px;}
  .tile-b1 .tile-media{height:252px;width:272px;}
  .tile-b1 .tile-cap{bottom:0;left:-62px;width:240px;}
  .tile-b2 .tile-media{height:280px;width:272px;}
  .tile-b2 .tile-cap{top:24px;right:0;}

  /* Project detail */
  .p-hero{position:relative;height:480px;background:#3B3F3A center/cover no-repeat;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;}
  .p-hero-shade{position:absolute;inset:0;background:rgba(0,0,0,.35);}
  .p-hero-text{position:relative;padding:0 24px;}
  .p-hero h1{margin:0;color:#fff;font-size:clamp(34px,5vw,48px);font-weight:800;letter-spacing:-.3px;}
  .p-hero p{margin:8px 0 0;color:#fff;font-size:14px;font-weight:500;letter-spacing:.4px;}
  .p-gallery{display:flex;gap:32px;overflow-x:auto;scroll-snap-type:x mandatory;padding:64px 32px 16px;}
  .p-gallery img{flex:0 0 min(600px,86vw);height:400px;object-fit:cover;scroll-snap-align:center;background:#F3F3F1;}
  .p-body{width:100%;max-width:1040px;margin:0 auto;padding:72px 24px 120px;}
  .p-cols{display:flex;flex-wrap:wrap;gap:48px 64px;}
  .p-main{flex:2 1 480px;min-width:0;display:flex;flex-direction:column;gap:36px;}
  .p-main h2{margin:0 0 12px;font-size:28px;font-weight:800;}
  .p-main p{margin:0 0 14px;font-size:16px;line-height:1.65;}
  .p-main p:last-child{margin-bottom:0;}
  .p-main ul{margin:0;padding-left:20px;font-size:16px;line-height:1.65;}
  .p-main li+li{margin-top:6px;}
  .p-facts{flex:1 1 260px;min-width:0;align-self:flex-start;background:var(--tile);padding:28px 28px 32px;display:flex;flex-direction:column;gap:20px;}
  .fact-label{font-size:12px;font-weight:600;letter-spacing:1px;color:var(--label);text-transform:uppercase;}
  .fact-value{font-size:16px;font-weight:600;margin-top:4px;line-height:1.4;}
  .p-links{display:flex;flex-direction:column;gap:10px;}
  .p-links .btn{width:100%;}
  .p-pager{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;margin-top:80px;border-top:1px solid var(--rule);padding-top:24px;font-size:16px;font-weight:600;}
  .p-pager a{padding:12px 0;}

  /* Resume */
  .resume{width:100%;max-width:1120px;margin:0 auto;padding:96px 24px 120px;}
  .resume .lede{margin:0 auto 28px;max-width:760px;text-align:center;font-size:16px;line-height:1.6;}
  .resume-dl{display:flex;justify-content:center;margin:0 0 40px;}
  .resume-cols{display:flex;flex-wrap:wrap;gap:36px;align-items:flex-start;justify-content:center;}
  .cv{flex:1 1 420px;min-width:0;max-width:820px;font-family:'Source Serif 4',Georgia,serif;font-size:13px;line-height:1.45;color:#1a1a1a;border:1px solid var(--ph-soft);padding:32px 32px 36px;}
  .cv-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;border-bottom:1px solid #1a1a1a;padding-bottom:8px;margin-bottom:14px;}
  .cv-name{font-size:26px;}
  .cv-contact{font-size:12px;}
  .cv-contact a{color:inherit;text-decoration:underline;text-underline-offset:2px;}
  .cv h2{margin:0 0 4px;font-size:13px;font-weight:600;letter-spacing:.5px;border-bottom:1px solid #1a1a1a;}
  .cv-section{margin-bottom:14px;}
  .cv-section:last-child{margin-bottom:0;}
  .cv-row{display:flex;justify-content:space-between;gap:12px;}
  .cv-row span:last-child{flex:0 0 auto;text-align:right;}
  .cv-org{font-weight:600;}
  .cv-role{font-style:italic;}
  .cv ul{margin:2px 0 10px;padding-left:18px;}
  .cv-section > ul:last-child{margin-bottom:0;}
  .photos{flex:1 1 320px;max-width:400px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
  .photos img{width:100%;height:280px;object-fit:cover;background:var(--ph-soft);}
  .photos img.wide{grid-column:span 2;height:220px;}

  @media (max-width:720px){
    .site-header{padding:16px 20px;gap:4px 24px;}
    .brand{order:-1;flex-basis:100%;}
    .nav{gap:28px;}
    .social{justify-content:flex-start;gap:24px;}
    .home{padding:24px 20px 64px;}
    .intro{padding:24px 0;}
    .ornament{display:none;}
    .projects,.resume{padding-top:56px;}
    .tiles{flex-direction:column;align-items:center;gap:40px;}
    .tile-col{display:contents;}
    .tile{width:100%;max-width:340px;}
    .tile-b1 .tile-cap{left:0;}
    .p-hero{height:300px;}
    .p-gallery{padding:40px 20px 16px;gap:16px;}
    .p-gallery img{height:260px;}
    .p-body{padding-top:48px;}
    .cv{padding:24px 20px;}
    .cv-row{flex-direction:column;gap:0;}
    .cv-row span:last-child{text-align:left;}
  }
</style>
</head>
<body>
<div id="app"></div>
<noscript><p style="padding:40px;font-family:system-ui,sans-serif">This site needs JavaScript. You can reach me at <a href="mailto:pontshombizo329@gmail.com">pontshombizo329@gmail.com</a>.</p></noscript>

<script>
(function () {
  "use strict";

  // ---------------------------------------------------------------------
  // Content. Projects and the resume live in content.json (git is the
  // source of truth); contact details below are only the defaults used
  // until it loads, so the header and home page render straight away.
  // ---------------------------------------------------------------------
  var content = null;
  var loadFailed = false;
  var contact = {
    email: 'pontshombizo329@gmail.com',
    github: 'github.com/PontshoMbizo',
    linkedin: 'www.linkedin.com/in/pontshombizo'
  };

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function url(s) {
    return /^[a-z]+:/i.test(s) ? s : 'https://' + s;
  }

  function each(list, fn) {
    return (list || []).map(fn).join('');
  }

  // ---------------------------------------------------------------------
  // Shared pieces
  // ---------------------------------------------------------------------
  function header(active) {
    var tabs = [['home', '#/', 'Home'], ['resume', '#/resume', 'Resume'], ['projects', '#/projects', 'Projects']];
    return '<header class="site-header">'
      + '<nav class="nav" aria-label="Main">'
      + each(tabs, function (t) {
          var on = t[0] === active;
          return '<a href="' + t[1] + '"' + (on ? ' class="is-active" aria-current="page"' : '') + '>' + t[2] + '</a>';
        })
      + '</nav>'
      + '<a class="brand" href="#/">Pontsho Mbizo’s Portfolio</a>'
      + '<div class="social">'
      + '<a href="' + esc(url(contact.linkedin)) + '" target="_blank" rel="noopener">LinkedIn</a>'
      + '<a href="' + esc(url(contact.github)) + '" target="_blank" rel="noopener">GitHub</a>'
      + '<a href="mailto:' + esc(contact.email) + '">Email</a>'
      + '</div>'
      + '</header>';
  }

  // Projects and Resume both need content.json; show why they're empty.
  function pending() {
    return '<p class="notice">' + (loadFailed
      ? 'Couldn’t load content.json. If you opened this file directly, serve the folder instead (python3 -m http.server).'
      : 'Loading…') + '</p>';
  }

  // ---------------------------------------------------------------------
  // Home
  // ---------------------------------------------------------------------
  // Isometric line drawings scattered behind the home page (hidden on phones).
  var ornaments = '<div class="home-bg" aria-hidden="true">' + each([
    ['quad', 'quadcopter_isometric.png'],
    ['enclosure', 'rugged_enclosure_isometric.png'],
    ['buoy', 'ocean_sensor_isometric.png'],
    ['gantry', 'gantry_robot_isometric.png'],
    ['rover', 'mars_rover_isometric.png']
  ], function (o) {
    return '<img class="ornament ornament-' + o[0] + '" src="images/' + o[1] + '" alt="">';
  }) + '</div>';

  function pageHome() {
    var portrait = '<div class="portrait"><img src="' + esc((content && content.portrait) || 'images/profile_picture.jpeg') + '" alt="Pontsho Mbizo"></div>';
    return '<main class="home">' + ornaments + '<div class="home-inner">'
      + portrait
      + '<div class="intro">'
      + '<h1>I’m Pontsho Mbizo, an Electrical &amp; Computer Engineer.</h1>'
      + '<p>I’m a final-year Electrical and Computer Engineering student at the University of Cape Town, building hardware that works — from FPGA logic and embedded firmware to low-cost robots for community gardens.</p>'
      + '<p>Take a look at what I’ve been building, and why.</p>'
      + '<div class="ctas">'
      + '<a class="btn" href="' + esc(url(contact.linkedin)) + '" target="_blank" rel="noopener">LinkedIn</a>'
      + '<a class="btn" href="#/projects">Projects</a>'
      + '<a class="btn" href="#/resume">Resume</a>'
      + '</div>'
      + '</div>'
      + '</div></main>';
  }

  // ---------------------------------------------------------------------
  // Projects grid — two staggered columns, each cycling through three
  // tile shapes. On phones the columns collapse into one list, kept in
  // content.json order via `order`.
  // ---------------------------------------------------------------------
  function tile(p, i) {
    var variant = (i % 2 ? 'b' : 'a') + (Math.floor(i / 2) % 3);
    var media = p.image
      ? '<img src="' + esc(p.image) + '" alt="" loading="lazy">'
      : '<span class="tile-mark" aria-hidden="true">' + esc(p.label) + '</span>';
    return '<a class="tile tile-' + variant + '" href="#/projects/' + encodeURIComponent(p.id) + '" style="order:' + i + '">'
      + '<div class="tile-cap"><div class="tile-name">' + esc(p.name) + '</div>'
      + (p.blurb ? '<div class="tile-blurb">' + esc(p.blurb) + '</div>' : '')
      + '</div>'
      + '<div class="tile-media">' + media + '</div>'
      + '</a>';
  }

  function pageProjects() {
    if (!content) return '<main class="projects"><h1 class="page-title">Projects.</h1>' + pending() + '</main>';
    var a = '', b = '';
    content.projects.forEach(function (p, i) {
      if (i % 2) b += tile(p, i); else a += tile(p, i);
    });
    return '<main class="projects"><h1 class="page-title">Projects.</h1>'
      + '<div class="tiles"><div class="tile-col tile-col-a">' + a + '</div><div class="tile-col tile-col-b">' + b + '</div></div>'
      + '</main>';
  }

  // ---------------------------------------------------------------------
  // Project page. Uses `sections`/`facts` when a project has them,
  // otherwise builds them from `desc`, `highlights`, `year` and `tags`.
  // ---------------------------------------------------------------------
  function pageProject(id) {
    if (!content) return '<main class="projects">' + pending() + '</main>';
    var list = content.projects;
    var idx = -1;
    list.forEach(function (p, i) { if (p.id === id) idx = i; });
    if (idx < 0) {
      return '<main class="projects"><h1 class="page-title">Not found.</h1>'
        + '<p class="notice">There’s no project called “' + esc(id) + '”. <a href="#/projects">See all projects →</a></p></main>';
    }
    var p = list[idx];
    var next = list[(idx + 1) % list.length];

    var subtitle = [p.subtitle || (p.full && p.full.indexOf(' — ') > 0 ? p.full.split(' — ').slice(1).join(' — ') : p.blurb), p.year]
      .filter(Boolean).join(' | ');

    var sections = p.sections || (p.desc ? [{ title: 'Overview', body: p.desc }] : []);
    var main = each(sections, function (s) {
      return '<div><h2>' + esc(s.title) + '.</h2>' + each(s.body, function (t) { return '<p>' + esc(t) + '</p>'; }) + '</div>';
    });
    if (p.highlights && p.highlights.length) {
      main += '<div><h2>Highlights.</h2><ul>' + each(p.highlights, function (h) { return '<li>' + esc(h) + '</li>'; }) + '</ul></div>';
    }

    var facts = (p.facts || []).slice();
    if (p.year) facts.unshift({ label: 'When', value: p.year });
    if (p.tags && p.tags.length) facts.push({ label: 'Focus', value: p.tags.join(' · ') });
    var aside = each(facts, function (f) {
      return '<div><div class="fact-label">' + esc(f.label) + '</div><div class="fact-value">' + esc(f.value) + '</div></div>';
    });
    if (p.links && p.links.length) {
      aside += '<div class="p-links">' + each(p.links, function (l) {
        return '<a class="btn" href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(l.label) + '</a>';
      }) + '</div>';
    }

    var hero = p.image ? ' style="background-image:url(\'' + esc(p.image) + '\')"' : '';
    var gallery = p.gallery && p.gallery.length
      ? '<section class="p-gallery" aria-label="Gallery">' + each(p.gallery, function (g) {
          return '<img src="' + esc(g.src) + '" alt="' + esc(g.alt) + '" loading="lazy">';
        }) + '</section>'
      : '';

    return '<section class="p-hero"' + hero + ' aria-label="' + esc(p.name) + '">'
      + '<div class="p-hero-shade"></div>'
      + '<div class="p-hero-text"><h1>' + esc(p.name) + '</h1>' + (subtitle ? '<p>' + esc(subtitle) + '</p>' : '') + '</div>'
      + '</section>'
      + gallery
      + '<main class="p-body">'
      + '<div class="p-cols"><div class="p-main">' + main + '</div>'
      + (aside ? '<aside class="p-facts">' + aside + '</aside>' : '')
      + '</div>'
      + '<div class="p-pager"><a href="#/projects">← All projects</a>'
      + '<a href="#/projects/' + encodeURIComponent(next.id) + '">Next: ' + esc(next.name) + ' →</a></div>'
      + '</main>';
  }

  // ---------------------------------------------------------------------
  // Resume
  // ---------------------------------------------------------------------
  function cvEntries(list) {
    return each(list, function (e) {
      return '<div class="cv-row cv-org"><span>' + esc(e.org) + '</span><span>' + esc(e.place) + '</span></div>'
        + '<div class="cv-row cv-role"><span>' + esc(e.role) + '</span><span>' + esc(e.dates) + '</span></div>'
        + '<ul>' + each(e.points, function (t) { return '<li>' + esc(t) + '</li>'; }) + '</ul>';
    });
  }

  function pageResume() {
    var lede = '<p class="lede">I’m a final-year Electrical and Computer Engineering student at the University of Cape Town, completing an ECSA-accredited degree. I’m most interested in hardware–software co-design — FPGA, embedded systems and DSP — and in engineering that fits the African context. I’m looking for graduate hardware engineering roles, with Germany as a primary destination.</p>'
      + '<div class="resume-dl"><a class="btn" href="cv.pdf" target="_blank" rel="noopener">Download PDF</a></div>';
    var r = content && content.resume;
    if (!r) return '<main class="resume"><h1 class="page-title">Resume.</h1>' + lede + pending() + '</main>';

    var cv = '<article class="cv" aria-label="Resume">'
      + '<div class="cv-head"><span class="cv-name">Pontsho Mbizo</span>'
      + '<span class="cv-contact">' + esc(r.location) + ' · <a href="mailto:' + esc(contact.email) + '">' + esc(contact.email) + '</a>'
      + ' · <a href="' + esc(url(contact.linkedin)) + '" target="_blank" rel="noopener">LinkedIn</a>'
      + ' · <a href="' + esc(url(contact.github)) + '" target="_blank" rel="noopener">GitHub</a></span></div>'
      + '<div class="cv-section"><h2>EDUCATION</h2>' + cvEntries(r.education) + '</div>'
      + '<div class="cv-section"><h2>EXPERIENCE</h2>' + cvEntries(r.experience) + '</div>'
      + '<div class="cv-section"><h2>PROJECTS</h2>' + each(r.projects, function (p) {
          return '<div class="cv-org">' + esc(p.name) + '</div><ul>' + each(p.points, function (t) { return '<li>' + esc(t) + '</li>'; }) + '</ul>';
        }) + '</div>'
      + '<div class="cv-section"><h2>ADDITIONAL INFORMATION</h2><ul>' + each(r.additional, function (t) { return '<li>' + esc(t) + '</li>'; }) + '</ul></div>'
      + '</article>';

    // Photo grid alternates wide / two-up / two-up / wide, as in the design.
    var photos = r.photos && r.photos.length
      ? '<div class="photos">' + each(r.photos, function (ph, i) {
          return '<img' + (i % 4 === 0 || i % 4 === 3 ? ' class="wide"' : '') + ' src="' + esc(ph.src) + '" alt="' + esc(ph.alt) + '" loading="lazy">';
        }) + '</div>'
      : '';

    return '<main class="resume"><h1 class="page-title">Resume.</h1>' + lede
      + '<div class="resume-cols">' + cv + photos + '</div></main>';
  }

  // ---------------------------------------------------------------------
  // Routing: #/  #/resume  #/projects  #/projects/<id>
  // ---------------------------------------------------------------------
  var app = document.getElementById('app');
  var lastRoute = null;

  function render() {
    var parts = location.hash.replace(/^#\/?/, '').split('/');
    var tab = 'home', body, title = 'Pontsho Mbizo — Electrical & Computer Engineer';
    if (parts[0] === 'resume') {
      tab = 'resume'; body = pageResume(); title = 'Resume — Pontsho Mbizo';
    } else if (parts[0] === 'projects' && parts[1]) {
      var id = decodeURIComponent(parts[1]);
      var p = content && content.projects.filter(function (x) { return x.id === id; })[0];
      tab = 'projects'; body = pageProject(id); title = (p ? p.name : 'Projects') + ' — Pontsho Mbizo';
    } else if (parts[0] === 'projects') {
      tab = 'projects'; body = pageProjects(); title = 'Projects — Pontsho Mbizo';
    } else {
      body = pageHome();
    }
    document.title = title;
    app.innerHTML = '<div class="page">' + header(tab) + body + '</div>';
    if (lastRoute !== null && lastRoute !== location.hash) window.scrollTo(0, 0);
    lastRoute = location.hash;
  }

  window.addEventListener('hashchange', render);
  render();

  fetch('content.json', { cache: 'no-store' }).then(function (r) {
    if (!r.ok) throw new Error('content.json ' + r.status);
    return r.json();
  }).then(function (data) {
    content = data;
    if (data.contact) contact = data.contact;
    render();
  }).catch(function (err) {
    console.warn('[portfolio] ' + err.message);
    loadFailed = true;
    render();
  });
})();
</script>
</body>
</html>

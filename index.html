  a{text-decoration:none;}
  .hoverable:hover{ background: var(--hover-bg, rgba(255,255,255,.07)); }

<body>

<script>
(function () {
  "use strict";

  // ---------------------------------------------------------------------
  // Data
  // ---------------------------------------------------------------------
  var walls = [
    'radial-gradient(120% 95% at 50% 16%, rgba(80,220,140,.28), rgba(80,220,140,0) 36%), linear-gradient(180deg,#0a3019 0%,#0f4d2a 34%,#1a7048 66%,#3cba78 100%)',
    'radial-gradient(120% 90% at 68% 20%, rgba(126,146,255,.30), transparent 42%), linear-gradient(180deg,#0c1030 0%,#1a1f4a 55%,#2b2f66 100%)',
    'radial-gradient(110% 85% at 30% 20%, rgba(64,220,160,.30), transparent 46%), linear-gradient(180deg,#0f1c1a 0%,#20443c 55%,#3a5a6e 100%)'
  ];

  var core = [
    { id: 'about', name: 'About Me', kind: 'about', color: '#3cb87a', label: 'A' },
    { id: 'experience', name: 'Experience', kind: 'experience', color: '#c9a227', label: 'X' },
    { id: 'files', name: 'Files', kind: 'files', color: '#3f7bd6', label: 'F' },
    { id: 'blog', name: 'Blog', kind: 'blog', color: '#2a7a52', label: 'B' },
    { id: 'terminal', name: 'Terminal', kind: 'terminal', color: '#2c2a26', label: '>' }
  ];

  // Live app launch links. Only used as a fallback if content.json fails to
  // fetch (see below) — the real copy of these lives in content.json, not here.
  var LIVE = {
    nika: 'https://nika.pontsho-mbizo.co.za/',
    stm: 'https://stm.pontsho-mbizo.co.za/'
  };

  var projects = [
    {
      id: 'nikavsim', name: 'nikaVSimulator', full: 'nikaVSimulator — FPGA / Verilog simulator', year: '2025',
      color: '#8a63d2', label: 'V', tags: ['FPGA', 'Verilog', 'Hardware Simulation'],
      desc: [
        'An in-browser simulator for the Tang Nano 9K FPGA. Write Verilog in a Monaco editor, run it through a sandboxed Icarus Verilog backend, and watch the board’s pins and waveforms come alive without touching real hardware.',
        'The simulation backend runs untrusted HDL inside locked-down, network-less containers on a rootless Podman socket — full isolation from the host even if the input is hostile.'
      ],
      highlights: [
        'Live board pin overlay synced to the simulated waveform.',
        'Ephemeral, fully sandboxed per-run containers — no network, dropped capabilities, resource caps.',
        'Deployed self-host, embeddable cross-origin by other tools.'
      ],
      links: [ { label: 'Launch Simulator', url: LIVE.nika }, { label: 'View source', url: 'https://github.com/PontshoMbizo/nikaVSimulator' } ]
    },
    {
      id: 'stmsim', name: 'STM Simulator', full: 'stmVSimulator — STM32 peripheral simulator', year: '2025',
      color: '#d98a2b', label: 'S', tags: ['Embedded', 'C', 'Emulation'],
      desc: [
        'A simulator for the STM32 "Blue Pill" that lets bare-metal C firmware be tested without the physical board in hand — faster iteration, and CI that doesn’t need hardware in the loop.',
        'Compiles and runs firmware through a sandboxed QEMU backend, then renders the resulting GPIO/peripheral trace on a live board view.'
      ],
      highlights: [
        'Models core peripherals closely enough to run real firmware.',
        'Turns "flash and pray" into a tight edit-run loop.',
        'Useful when hardware is shared or unavailable.'
      ],
      links: [ { label: 'Launch Simulator', url: LIVE.stm }, { label: 'View source', url: 'https://github.com/PontshoMbizo/stmVSimulator' } ]
    },
    {
      id: 'mcc-sizing-tool', name: 'MCC Sizing Tool', full: 'Three-Phase MCC Sizing Tool — Tharisa Minerals', year: 'Dec 2025 – Jan 2026',
      color: '#d9a441', label: 'MCC', tags: ['Power Systems', 'MS Excel', 'Industrial Engineering'],
      desc: [
        'In industrial electrical distribution, a miscalculated cable size or an under-rated busbar isn\'t just an inefficiency — it can mean a flashover, or an electrician who doesn\'t go home that evening. That stakes-level thinking shaped this tool.',
        'I built a parameterised three-phase motor control centre (MCC) sizing tool in Excel that takes a transformer, a set of motor loads, their starting methods and feeder lengths, and returns full-load and feeder currents (including largest-motor inrush), voltage drop across feeder cables and busbars, the equivalent power factor of the combined load, and weekly energy consumption and operating cost per motor.',
        'Every output is computed two ways — analytically from first principles, and from manufacturer tables (SANS 1507 cables, Austral Wright copper busbars, WEG W22 IE3 motor data) — with the percentage deviation between the two built in as an automatic sanity check.'
      ],
      highlights: [
        'Adopted by the Tharisa site engineering team as the baseline tool for all feeder studies.',
        'Methodology report formally accepted by the engineering department.',
        'Presented cost-comparison results directly to the project engineering team.',
        'Built-in analytical-vs-manufacturer-data deviation check catches specification errors before procurement.'
      ],
      links: []
    },
    {
      id: 'sram-capture', name: 'SRAM Data Capture', full: 'SRAM Data Capture (MAX10 FPGA) — Cybicom Atlas Defence', year: 'Jun – Jul 2025',
      color: '#c1622f', label: 'FPGA', tags: ['FPGA', 'Verilog', 'Defence', 'Digital Design'],
      desc: [
        'A control system aboard a submarine uses an ASIC connected to a non-volatile SRAM chip (M48T35) to load critical boot and configuration data. The SRAM depends on an internal battery to retain its contents — if that battery fails, the data is lost permanently and the system becomes non-functional. I was tasked with extracting the data without interfering with the system\'s normal operation.',
        'The hard constraint was timing: the SRAM only makes valid data available for a 10ns window, roughly 70ns after the Chip Enable and Output Enable lines are asserted — confirmed on an oscilloscope. I designed a custom high-speed capture system on a MAX10 FPGA (DE10-Lite) to hit that window: a PLL generating a 200MHz clock from the 50MHz input, a 4-bit counter incrementing every 5ns to delay sampling to exactly 70ns, logic that watches the enable lines and fires the capture at the right cycle, and registers latching the 8-bit data and 15-bit address.',
        'To interface safely with the 5V SRAM bus without loading it, I also designed a hardware buffer stage using 8-bit bus buffers as level shifters, protecting both systems and preserving signal integrity.'
      ],
      highlights: [
        'Hit a 10ns valid-data window with 70ns timing precision, verified on an oscilloscope.',
        'Designed and implemented the capture logic in Verilog on an Intel MAX10 FPGA.',
        'Built a hardware level-shifting interface to safely bridge 5V and FPGA logic levels.',
        'Non-destructively preserved mission-critical configuration data on legacy submarine hardware.'
      ],
      links: []
    },
    {
      id: 'udp-motion-sim', name: 'UDP Motion Sim Comms', full: 'UDP Communication for a Motion Simulator — Cybicom Atlas Defence', year: 'Jun – Jul 2025',
      color: '#b8863f', label: 'UDP', tags: ['C', 'Networking', 'Real-Time Systems'],
      desc: [
        'Cybicom\'s motion simulator needed a reliable channel to exchange control and status messages with its instructor station. I built a bidirectional, multi-threaded UDP communication system in C using POSIX threads on Windows.',
        'A client thread sends MessageToMotionSystem packets via sendto() with a custom checksum for data integrity; a server thread listens with recvfrom() and validates incoming data against that same checksum; a main thread launches both and passes socket and message data through custom struct arguments.',
        'The result is a full-duplex, thread-safe UDP system, robust and extensible enough to be handed off for simulator integration, with documentation to match.'
      ],
      highlights: [
        'Full-duplex, thread-safe UDP client/server architecture in C with POSIX threads.',
        'Custom checksum validation on both send and receive paths for data integrity.',
        'Delivered with handover documentation for integration by the simulator team.'
      ],
      links: []
    },
    {
      id: 'sim-mount', name: 'Simulator Mounting Rig', full: 'Custom Mounting Solution for a Simulation Computer — Cybicom Atlas Defence', year: 'Jun – Jul 2025',
      color: '#8c6a3f', label: 'CAD', tags: ['Mechanical Design', 'Fusion 360', '3D Printing'],
      desc: [
        'A 4U 19-inch COTS simulation computer needed to be securely mounted inside the instructor station of a motion simulator — but the rack-mounted unit was prone to sliding under the inertial forces the simulator itself produced, and still needed to come out easily for maintenance.',
        'I 3D-printed custom measurement jigs (designed in Fusion 360, sliced in Cura) to accurately map the mounting dimensions, then developed a parametric hinge-and-hook system that secures the unit while keeping it serviceable. M6 bolts handle the shear and tensile loads, sized for the expected forces.',
        'The mounting was verified through visual inspection and mechanical testing: zero visible stress on the unit, and full access via a single bolt release and hook rotation.'
      ],
      highlights: [
        'Designed and 3D-printed custom measurement tooling to capture accurate mounting dimensions.',
        'Developed a parametric hinge-and-hook mount balancing security against inertial loads with easy serviceability.',
        'Verified under mechanical testing with zero visible stress and single-action release.'
      ],
      links: []
    },
    {
      id: 'network-vacation-work', name: 'Plant Network Restoration', full: 'Network Infrastructure & Restoration — Tharisa Minerals', year: 'Dec 2024 – Jan 2025',
      color: '#7a8f4a', label: 'NET', tags: ['Networking', 'Infrastructure', 'Cloud'],
      desc: [
        'As a Network Engineer/Artisan vacation student, I worked on restoring and expanding Tharisa\'s network infrastructure across the plant — bringing critical systems back online, connecting new office spaces, and investigating Microsoft Cloud PC as a potential long-term remote-work solution.',
        'The work was hands-on and infrastructure-first: fibre optic cable installation and configuration, switch-device connectivity, and troubleshooting LAN connections between devices and a central server across multiple sites.'
      ],
      highlights: [
        'Restored LAN connectivity between devices and a server across multiple plant sites.',
        'Investigated Microsoft Cloud PC as a cost-reduction strategy for remote operations.',
        'Expanded network access by connecting new office spaces into the existing infrastructure.'
      ],
      links: []
    },
    {
      id: 'electrical-instrumentation-vacation', name: 'Electrical & Instrumentation Vacation Work', full: 'Electrical and Instrumentation Technician — Tharisa Minerals', year: 'Dec 2023 – Jan 2024',
      color: '#9c7a4a', label: 'E&I', tags: ['Electrical Maintenance', 'Instrumentation'],
      desc: [
        'My first placement at Tharisa: shadowing and assisting Electrical Artisans and Instrumentation Technicians in their daily, routine work — inspecting and maintaining plant electrical equipment and control systems.',
        'It was a ground-level introduction to industrial electrical maintenance, and the first time I saw, up close, why the fundamentals I was starting to learn at university actually mattered on a real plant floor.'
      ],
      highlights: [
        'Shadowed and assisted qualified Electrical Artisans and Instrumentation Technicians.',
        'Gained first-hand exposure to routine inspection and maintenance of industrial electrical equipment.',
        'First industry placement — the starting point for four consecutive years of vacation work in the field.'
      ],
      links: []
    }
  ];

  // Work-experience timeline (Experience app). Kept separate from `projects`
  // rather than as a content.json field, since it's edited by hand in this
  // file, not through content.json. `artefacts` references project ids
  // above — every id listed there should exist in `projects`.
  var experience = [
    {
      company: 'Tharisa Minerals', role: 'Project Engineering Intern', period: 'Dec 2025 – Jan 2026',
      location: 'Rustenburg, North West',
      summary: 'Assigned to the project engineering team, gaining exposure to project management on industrial mining infrastructure — scope, management of change, costing, procurement and engineering sign-off.',
      artefacts: ['mcc-sizing-tool']
    },
    {
      company: 'Cybicom Atlas Defence', role: 'Engineering Intern', period: 'Jun – Jul 2025',
      location: 'Simon\'s Town, Western Cape',
      summary: 'Multidisciplinary engineering across embedded hardware and firmware, software development and testing, mechanical design and 3D printing, and systems integration — including an Acceptance Test Procedure for a full motion simulation system.',
      artefacts: ['sram-capture', 'udp-motion-sim', 'sim-mount']
    },
    {
      company: 'Tharisa Minerals', role: 'Network Engineer/Artisan (Vacation Work)', period: 'Dec 2024 – Jan 2025',
      location: 'Rustenburg, North West',
      summary: 'Worked on network infrastructure, system restoration and cloud computing across multiple plant sites.',
      artefacts: ['network-vacation-work']
    },
    {
      company: 'Tharisa Minerals', role: 'Electrical and Instrumentation Technician (Vacation Work)', period: 'Dec 2023 – Jan 2024',
      location: 'Rustenburg, North West',
      summary: 'Assisted Electrical Artisans and Instrumentation Technicians with inspection and maintenance of plant electrical equipment and control systems — my first hands-on exposure to industrial electrical work.',
      artefacts: []
    }
  ];

  var posts = [
    {
      title: "Getting the 'why' right before the build", date: 'Jun 2026', tag: 'Essay',
      pars: [
        'It’s tempting to start building the moment a problem is handed to you. The tools are right there, the deadline is real, and typing feels like progress. I’ve learned to resist that pull.',
        'Before I reach for a tool, I try to understand the fundamentals of what I’m actually solving. Getting the why right — why this approach, why this constraint matters, why the obvious solution fails — saves far more time than moving fast ever does.',
        'It also means giving myself room to be wrong early, when being wrong is cheap. A wrong assumption caught on paper costs an afternoon. The same assumption caught in silicon costs a semester.'
      ]
    },
    {
      title: 'What four vacation placements taught me before I could call myself an engineer', date: 'Jan 2026', tag: 'Reflection',
      pars: [
        'My first placement at Tharisa had me shadowing electrical artisans, watching them inspect and maintain equipment I barely understood on paper. My most recent placement had me presenting a costing tool I\'d built to the project engineering team. Four vacations apart, and the distance between those two versions of me is the whole point of doing this while still studying.',
        'Each placement changed what I paid attention to. Network restoration taught me that infrastructure work is mostly about finding the one broken link in a system that looks fine from the top. The MCC sizing tool taught me that engineers don\'t trust a single number — they compute it twice, from different assumptions, and interrogate the gap between the two answers.',
        'None of this replaces coursework. But it\'s the part of engineering that doesn\'t show up in a syllabus: what it feels like when a methodology report you wrote gets accepted by people who\'ve been doing this for twenty years, and have every reason to say no.'
      ]
    }
  ];

  var skills = ['Embedded Systems', 'Digital Signal Processing', 'FPGA / HDL', 'C / C++', 'Python', 'Machine Learning', 'PCB Design', 'High-Performance Computing', 'Control Systems', 'Power Systems', 'Mechanical Design (CAD)'];

  var CONTACT = { email: 'pontshombizo329@gmail.com', github: 'github.com/PontshoMbizo', linkedin: 'www.linkedin.com/in/pontshombizo' };

  // The arrays above are the fallback/default content, used if content.json
  // can't be fetched (e.g. opened as a bare file://). Once deployed,
  // content.json is the real source of truth and overrides these on load.
  function loadContent() {
    fetch('content.json', { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('content.json ' + r.status);
      return r.json();
    }).then(function (data) {
      if (Array.isArray(data.projects)) projects = data.projects;
      if (Array.isArray(data.posts)) posts = data.posts;
      if (Array.isArray(data.skills)) skills = data.skills;
      if (data.contact && typeof data.contact === 'object') CONTACT = data.contact;
      render();
    }).catch(function () { /* keep built-in defaults */ });
  }

  // ---------------------------------------------------------------------
  // State
  // ---------------------------------------------------------------------
  var state = {
    booted: false, boot: 0,
    active: null, overview: false, query: '',
    blogPost: null, filesPath: 'Projects',
    ctx: { open: false, x: 0, y: 0 }, wallpaper: 0,
    time: '', date: '',
    termInput: '', termLog: [], launched: null,
    help: false, hint: false
  };

  var root = document.getElementById('root');
  var clockId, bootId;

  function setState(patch) {
    if (typeof patch === 'function') patch = patch(state);
    if (!patch) return;
    Object.assign(state, patch);
    render();
  }

  // ---------------------------------------------------------------------
  // Derived data helpers
  // ---------------------------------------------------------------------
  // Favicon to show in a project's icon in place of the letter, if it has
  // one. `icon` on the project data wins if set; otherwise, for projects
  // with a live link, try that origin's default /favicon.ico. appIcon()
  // falls back to the letter automatically if the image 404s/fails to load.
  function projectIcon(p) {
    if (p.icon) return p.icon;
    if (p.links && p.links.length && p.links[0].url) {
      try { return new URL(p.links[0].url).origin + '/favicon.ico'; } catch (e) { return null; }
    }
    return null;
  }
  function allApps() {
    return core.concat(projects.map(function (p) { return { id: p.id, name: p.name, kind: 'letter', color: p.color, label: p.label, icon: projectIcon(p) }; }));
  }
  function filteredApps() {
    var q = state.query.trim().toLowerCase();
    var all = allApps();
    return q ? all.filter(function (a) { return a.name.toLowerCase().indexOf(q) !== -1; }) : all;
  }
  function filesFor(path) {
    if (path === 'Projects') return projects.map(function (p) { return { name: p.name, kind: 'letter', color: p.color, label: p.label, icon: projectIcon(p), open: function () { open(p.id); } }; });
    if (path === 'Blog') return posts.map(function (p, i) { return { name: p.title, kind: 'doc', color: '#8a8378', label: '', open: function () { openPost(i); } }; });
    return [
      { name: 'About Me.txt', kind: 'doc', color: '#8a8378', label: '', open: function () { open('about'); } },
      { name: 'Experience — CV Summary.txt', kind: 'doc', color: '#8a8378', label: '', open: function () { open('experience'); } },
      { name: 'CV — Pontsho Mbizo.pdf', kind: 'doc', color: '#8a8378', label: '', open: function () { window.open('cv.pdf', '_blank', 'noopener'); } }
    ];
  }

  // ---------------------------------------------------------------------
  // Actions
  // ---------------------------------------------------------------------
  function open(id) {
    setState({ active: id, overview: false, ctx: { open: false, x: 0, y: 0 }, launched: id, hint: false });
    setTimeout(function () { if (state.launched === id) setState({ launched: null }); }, 560);
  }
  function toggleHelp() { setState({ help: !state.help, hint: false, ctx: { open: false, x: 0, y: 0 } }); }
  function closeHelp() { setState({ help: false }); }
  function openPost(i) { setState({ active: 'blog', blogPost: i, overview: false, ctx: { open: false, x: 0, y: 0 } }); }
  function blogBack() { setState({ blogPost: null }); }
  function toggleOverview() { setState({ overview: !state.overview, query: '', ctx: { open: false, x: 0, y: 0 } }); }
  function closeOverview() { setState({ overview: false }); }
  function closeWindow() { setState({ active: null }); }
  function setFiles(p) { setState({ filesPath: p }); }
  function setWall(i) { setState({ wallpaper: i, ctx: { open: false, x: 0, y: 0 } }); }
  function onDeskContext(e) { e.preventDefault(); setState({ ctx: { open: true, x: e.clientX, y: e.clientY } }); }
  function onDeskClick() { if (state.ctx.open) setState({ ctx: { open: false, x: 0, y: 0 } }); }
  function onSearchInput(e) { setState({ query: e.target.value }); }
  function onSearchKey(e) { if (e.key === 'Enter') { var l = filteredApps(); if (l[0]) open(l[0].id); } }
  function onTermInput(e) { state.termInput = e.target.value; } // no re-render needed until Enter
  function onTermKey(e) { if (e.key === 'Enter') { e.preventDefault(); runCmd(state.termInput); } }
  function focusTerm() { var el = document.getElementById('term-input'); if (el) el.focus(); }
  function stop(e) { e.stopPropagation(); }

  // Deliberately NOT routed through setState()/render(): this fires every 15s
  // for as long as the page is open, and a full innerHTML rebuild would replay
  // every CSS entrance animation on the page (most visibly the open window's
  // `winopen` pop-in) since a fresh DOM node always restarts its animation —
  // that read as the window "blinking" closed and open again every 15s.
  // Mutate state directly (so a render triggered for any other reason still
  // shows the right clock) and patch just the two clock text nodes in place.
  function tick() {
    var d = new Date();
    var h = d.getHours(), m = d.getMinutes();
    var ap = h >= 12 ? 'PM' : 'AM'; h = h % 12; if (h === 0) h = 12;
    var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    state.time = h + ':' + String(m).padStart(2, '0') + ' ' + ap;
    state.date = months[d.getMonth()] + ' ' + d.getDate();
    var timeEl = document.getElementById('clock-time');
    var dateEl = document.getElementById('clock-date');
    if (timeEl) timeEl.textContent = state.time;
    if (dateEl) dateEl.textContent = state.date;
  }

  function runCmd(raw) {
    var cmd = (raw || '').trim();
    var parts = cmd.split(/\s+/);
    var c = (parts[0] || '').toLowerCase();
    var arg = parts[1];
    var lines = []; var openId = null;
    if (c === '') { lines = []; }
    else if (c === 'help') {
      lines = ['pontshoOS — available commands', '', '  help              this help', '  ls                list apps', '  about             open About Me', '  experience        open work experience / CV', '  projects          list projects', '  open <id>         open an app / project', '  blog              open the blog', '  contact           how to reach me', '  neofetch          system info', '  clear             clear the screen'];
    } else if (c === 'ls') {
      lines = ['about   experience   blog   files   terminal', 'projects   contact'];
    } else if (c === 'whoami') {
      lines = ['Pontsho Mbizo — Electrical & Computer Engineer, UCT'];
    } else if (c === 'about') { openId = 'about'; lines = ['Opening About Me…']; }
    else if (c === 'experience') { openId = 'experience'; lines = ['Opening Experience…']; }
    else if (c === 'blog') { openId = 'blog'; lines = ['Opening Blog…']; }
    else if (c === 'files') { openId = 'files'; lines = ['Opening Files…']; }
    else if (c === 'projects') {
      lines = ['Projects — open with: open <id>', ''].concat(projects.map(function (p) { return '  ' + p.id.padEnd(12) + p.full; }));
    } else if (c === 'open') {
      var t = (arg || '').toLowerCase();
      var ids = ['about', 'experience', 'blog', 'files', 'terminal'].concat(projects.map(function (p) { return p.id; }));
      if (ids.indexOf(t) !== -1) { openId = t; lines = ['Opening ' + t + '…']; }
      else { lines = ["open: no such app: '" + (arg || '') + "'   (try: projects)"]; }
    } else if (c === 'contact') {
      lines = ['email     ' + CONTACT.email, 'github    ' + CONTACT.github, 'linkedin  ' + CONTACT.linkedin];
    } else if (c === 'neofetch') {
      lines = ['pontsho@pontshoOS', '-----------------', 'OS       pontshoOS 1.0 (web)', 'Host     Portfolio', 'Kernel   JavaScript', 'Uptime   final year', 'Shell    pontsho-sh', 'Role     ECE @ University of Cape Town', 'Focus    embedded · DSP · HPC · hardware', 'Theme    Desert (warm)'];
    } else if (c === 'date') { lines = [new Date().toString()]; }
    else if (c === 'echo') { lines = [parts.slice(1).join(' ')]; }
    else if (c === 'sudo') { lines = ['Permission denied: you are already root of your own story.']; }
    else if (c === 'clear') { setState({ termLog: [], termInput: '' }); return; }
    else { lines = ['pontsho-sh: command not found: ' + c, "type 'help' for a list of commands"]; }
    state.termLog = state.termLog.concat([{ cmd: raw, lines: lines }]);
    state.termInput = '';
    render();
    if (openId) open(openId);
  }

  // ---------------------------------------------------------------------
  // Icon rendering (mirrors AppIcon.dc.html)
  // ---------------------------------------------------------------------
  var brokenIcons = {}; // urls that already 404'd this session -- don't retry them
  function appIcon(kind, color, label, size, icon) {
    if (icon && brokenIcons[icon]) icon = null; // skip a known-dead fetch entirely
    var glyphSize = Math.round(size * 0.42);
    var svgSize = Math.round(size * 0.56);
    var bg = color || '#3f7bd6';
    var inner = '';
    if (kind === 'terminal') {

  function ah(x, y, dir) {
    var s = 6;
    if (dir === 'r') return '<polygon points="' + x + ',' + y + ' ' + (x - s) + ',' + (y - s * 0.7) + ' ' + (x - s) + ',' + (y + s * 0.7) + '"></polygon>';
    if (dir === 'l') return '<polygon points="' + x + ',' + y + ' ' + (x + s) + ',' + (y - s * 0.7) + ' ' + (x + s) + ',' + (y + s * 0.7) + '"></polygon>';
    if (dir === 'd') return '<polygon points="' + x + ',' + y + ' ' + (x - s * 0.7) + ',' + (y - s) + ' ' + (x + s * 0.7) + ',' + (y - s) + '"></polygon>';
    if (dir === 'u') return '<polygon points="' + x + ',' + y + ' ' + (x - s * 0.7) + ',' + (y + s) + ' ' + (x + s * 0.7) + ',' + (y + s) + '"></polygon>';
    return '';
  }

        caption: 'E_n and G_n fall together; the data is only valid for a 10ns window starting 70ns later — the FPGA logic samples precisely inside it.',
        svg: '<polyline points="40,40 200,40 200,70 560,70" fill="none" stroke-width="1.6"></polyline>'
          + '<text x="18" y="44" text-anchor="end" font-family=' + F + ' font-size="11" font-weight="700">E_n</text>'
          + '<polyline points="40,95 220,95 220,125 560,125" fill="none" stroke-width="1.6"></polyline>'
          + '<text x="18" y="99" text-anchor="end" font-family=' + F + ' font-size="11" font-weight="700">G_n</text>'
          + '<rect x="270" y="15" width="40" height="145" fill="' + color + '" fill-opacity="0.16" stroke="' + color + '" stroke-width="1.2" stroke-dasharray="3,3"></rect>'
          + '<text x="290" y="11" text-anchor="middle" font-family=' + F + ' font-size="9.5" font-weight="700" fill="' + color + '">10ns valid window</text>'
          + '<line x1="200" y1="165" x2="200" y2="175" stroke-width="1.2" stroke="' + color + '"></line><line x1="270" y1="165" x2="270" y2="175" stroke-width="1.2" stroke="' + color + '"></line>'
          + '<line x1="200" y1="170" x2="270" y2="170" stroke-width="1.2" stroke="' + color + '"></line>'
          + '<text x="235" y="184" text-anchor="middle" font-family=' + F + ' font-size="10" font-weight="700" fill="' + color + '">70ns</text>'
      };
    }
    if (id === 'udp-motion-sim') {
      return { w: 640, h: 185,
        aria: 'Sequence diagram: a main thread spawns a client thread and a server thread; the client sends a checksummed packet to the server, and the server validates and replies the same way.',
        caption: 'A main thread spawns a client and server thread; each direction carries its own checksum-validated packet — full-duplex and thread-safe.',
        svg: '<rect x="270" y="8" width="100" height="26" rx="6" fill="none" stroke-width="1.3"></rect><text x="320" y="26" text-anchor="middle" font-family=' + F + ' font-size="10" font-weight="700">main thread</text>'
          + '<line x1="290" y1="34" x2="155" y2="40" stroke-width="1.1" stroke-dasharray="3,3" opacity="0.7"></line>' + ah(155, 40, 'd')
          + '<line x1="350" y1="34" x2="485" y2="40" stroke-width="1.1" stroke-dasharray="3,3" opacity="0.7"></line>' + ah(485, 40, 'd')
          + '<circle cx="150" cy="55" r="15" fill="none" stroke-width="1.3"></circle><text x="150" y="59" text-anchor="middle" font-family=' + F + ' font-size="10" font-weight="700">C</text>'
          + '<text x="150" y="82" text-anchor="middle" font-family=' + F + ' font-size="10" opacity="0.7">Client thread</text>'
          + '<circle cx="490" cy="55" r="15" fill="none" stroke-width="1.3"></circle><text x="490" y="59" text-anchor="middle" font-family=' + F + ' font-size="10" font-weight="700">S</text>'
          + '<text x="490" y="82" text-anchor="middle" font-family=' + F + ' font-size="10" opacity="0.7">Server thread</text>'
          + '<line x1="150" y1="90" x2="150" y2="172" stroke-width="1.1" stroke-dasharray="2,4" opacity="0.4"></line>'
          + '<line x1="490" y1="90" x2="490" y2="172" stroke-width="1.1" stroke-dasharray="2,4" opacity="0.4"></line>'
          + '<line x1="150" y1="112" x2="483" y2="112" stroke-width="1.4" stroke="' + color + '"></line><polygon points="490,112 480,106 480,118" fill="' + color + '"></polygon>'
          + '<text x="320" y="104" text-anchor="middle" font-family=' + F + ' font-size="9" fill="' + color + '">sendto() &middot; checksum</text>'
          + '<line x1="490" y1="150" x2="157" y2="150" stroke-width="1.4" stroke="' + color + '"></line><polygon points="150,150 160,144 160,156" fill="' + color + '"></polygon>'
          + '<text x="320" y="142" text-anchor="middle" font-family=' + F + ' font-size="9" fill="' + color + '">recvfrom() &middot; validate</text>'
      };
    }
    if (id === 'sim-mount') {
      return { w: 640, h: 160,
        aria: 'Diagram: a rack-mounted computer secured by a hinge, a quick-release hook and an M6 bolt, resisting the inertial force generated by simulator motion.',
        caption: 'A hinge-and-hook mount plus M6 bolts resist the inertial loads from simulator motion, while keeping the unit serviceable with a single release.',
        svg: '<rect x="200" y="40" width="240" height="70" rx="4" fill="none" stroke-width="1.5"></rect><text x="320" y="80" text-anchor="middle" font-family=' + F + ' font-size="11" font-weight="700">4U simulation computer</text>'
          + '<circle cx="200" cy="75" r="6" fill="' + color + '"></circle><text x="200" y="130" text-anchor="middle" font-family=' + F + ' font-size="9" fill="' + color + '">hinge</text>'
          + '<path d="M440,95 L458,95 L458,112 L448,112" fill="none" stroke="' + color + '" stroke-width="2"></path><text x="465" y="118" text-anchor="middle" font-family=' + F + ' font-size="9" fill="' + color + '">hook</text>'
          + '<line x1="320" y1="110" x2="320" y2="128" stroke="' + color + '" stroke-width="2.5"></line><rect x="313" y="126" width="14" height="8" rx="1" fill="' + color + '"></rect><text x="320" y="148" text-anchor="middle" font-family=' + F + ' font-size="9" fill="' + color + '">M6 bolt</text>'
          + '<line x1="600" y1="55" x2="450" y2="55" stroke-width="1.3" opacity="0.6"></line>' + ah(450, 55, 'l')
          + '<text x="600" y="40" text-anchor="end" font-family=' + F + ' font-size="9" opacity="0.6">inertial force (sim motion)</text>'
      };
    }
    if (id === 'network-vacation-work') {
      return { w: 640, h: 180,
        aria: 'Network diagram: a central server connected to four plant sites; one link, highlighted, was restored after going down.',
        caption: 'Central server connected to four plant sites — one LAN link, highlighted, restored after going down.',
        svg: '<circle cx="320" cy="90" r="26" fill="none" stroke-width="1.5"></circle><text x="320" y="94" text-anchor="middle" font-family=' + F + ' font-size="10" font-weight="700">Server</text>'
          + '<line x1="320" y1="64" x2="320" y2="43" stroke-width="1.3"></line>'
          + '<line x1="346" y1="90" x2="502" y2="90" stroke-width="1.3"></line>'
          + '<line x1="294" y1="90" x2="138" y2="90" stroke="rgba(236,231,225,.3)" stroke-width="1.3" stroke-dasharray="4,4"></line>'
          + '<line x1="294" y1="90" x2="138" y2="90" stroke="' + color + '" stroke-width="2.2"></line>'
          + '<text x="216" y="79" text-anchor="middle" font-family=' + F + ' font-size="9" font-weight="700" fill="' + color + '">restored</text>'
          + '<line x1="320" y1="116" x2="320" y2="137" stroke-width="1.3"></line>'
          + '<circle cx="320" cy="25" r="18" fill="none" stroke-width="1.3"></circle><text x="320" y="29" text-anchor="middle" font-family=' + F + ' font-size="9">Site A</text>'
          + '<circle cx="520" cy="90" r="18" fill="none" stroke-width="1.3"></circle><text x="520" y="94" text-anchor="middle" font-family=' + F + ' font-size="9">Site B</text>'
          + '<circle cx="120" cy="90" r="18" fill="none" stroke="' + color + '" stroke-width="1.8"></circle><text x="120" y="94" text-anchor="middle" font-family=' + F + ' font-size="9" fill="' + color + '">Site C</text>'
          + '<circle cx="320" cy="155" r="18" fill="none" stroke-width="1.3"></circle><text x="320" y="159" text-anchor="middle" font-family=' + F + ' font-size="9">Site D</text>'
      };
    }
    if (id === 'electrical-instrumentation-vacation') {
      var rows = [['insulation resistance', 70], ['terminal torque', 95], ['control loop response', 120]];
      var rowsSvg = rows.map(function (r) {
        var y = r[1];
        return '<rect x="356" y="' + (y - 10) + '" width="14" height="14" rx="3" fill="none" stroke-width="1.2"></rect>'
          + '<path d="M358,' + (y - 3) + ' L362,' + (y + 1) + ' L368,' + (y - 8) + '" fill="none" stroke="' + color + '" stroke-width="1.6"></path>'
          + '<text x="380" y="' + (y + 2) + '" font-family=' + F + ' font-size="9.5" opacity="0.8">' + r[0] + '</text>';
      }).join('');
      return { w: 640, h: 170,
        aria: 'Diagram: an analog gauge needle sitting within its normal operating range, beside a checklist of routine electrical and instrumentation inspection items.',
        caption: 'Routine inspection and maintenance of plant electrical equipment — reading gauges, checking loops, keeping the plant in its normal operating band.',
        svg: '<path d="M90,120 A80,80 0 0 1 250,120" fill="none" stroke-width="2"></path>'
          + '<path d="M210,51 A80,80 0 0 1 130,51" fill="none" stroke="' + color + '" stroke-width="5" stroke-linecap="round"></path>'
          + '<line x1="170" y1="120" x2="159" y2="56" stroke-width="2.5"></line><circle cx="170" cy="120" r="6" fill="currentColor"></circle>'
          + '<text x="170" y="145" text-anchor="middle" font-family=' + F + ' font-size="9" fill="' + color + '">normal range</text>'
          + '<rect x="340" y="30" width="250" height="115" rx="6" fill="none" stroke-width="1.3"></rect>'
          + '<text x="356" y="52" font-family=' + F + ' font-size="10" font-weight="700">Inspection checklist</text>'
          + rowsSvg
      };
    }
    return null;
  }

  function projectDiagramBlock(proj) {
    var d = diagramFor(proj.id, proj.color);
    if (!d) {
      return '<div style="height:150px;margin:26px 0;border-radius:12px;border:1px solid rgba(255,255,255,.09);background:repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 10px,transparent 10px 20px);display:flex;align-items:center;justify-content:center;font-family:\'JetBrains Mono\',monospace;font-size:13px;color:rgba(236,231,225,.4);">diagram coming soon</div>';
    }
    return '<figure style="margin:26px 0 30px;padding:22px 24px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.03);">'
      + '<svg viewBox="0 0 ' + d.w + ' ' + d.h + '" role="img" aria-label="' + esc(d.aria) + '" style="width:100%;height:auto;display:block;color:rgba(236,231,225,.6);fill:currentColor;stroke:currentColor;">' + d.svg + '</svg>'
      + '<figcaption style="margin-top:12px;font-size:12.5px;line-height:1.5;color:rgba(236,231,225,.45);text-align:center;">' + esc(d.caption) + '</figcaption>'
      + '</figure>';
  }

  function renderProject(proj) {
    var tagsHtml = proj.tags.map(function (t) { return '<span style="padding:6px 13px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);font-size:13px;color:#ece7e1;">' + esc(t) + '</span>'; }).join('');
    var descHtml = proj.desc.map(function (d) { return '<p style="font-size:16.5px;line-height:1.72;color:rgba(236,231,225,.9);margin:0 0 18px;">' + esc(d) + '</p>'; }).join('');
    var highlightsHtml = proj.highlights.map(function (h) {
      return '<div style="display:flex;gap:12px;align-items:flex-start;"><span style="width:7px;height:7px;border-radius:2px;background:' + proj.color + ';margin-top:8px;flex:none;transform:rotate(45deg);"></span><span style="font-size:15.5px;line-height:1.6;color:rgba(236,231,225,.85);">' + esc(h) + '</span></div>';
    }).join('');
    var linksHtml = '';
    if (proj.links && proj.links.length) {
      linksHtml = '<div style="display:flex;gap:12px;flex-wrap:wrap;">' + proj.links.map(function (lk) {
        return '<a href="' + esc(lk.url) + '" target="_blank" rel="noopener" style="padding:10px 20px;border-radius:10px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);font-size:14px;font-weight:700;color:#ece7e1;cursor:pointer;display:inline-block;">' + esc(lk.label) + ' &rarr;</a>';
      }).join('') + '</div>';
    }
    return '<div><div style="height:180px;display:flex;align-items:flex-end;padding:26px 40px;background:linear-gradient(135deg, ' + proj.color + ', rgba(20,18,16,.65));position:relative;overflow:hidden;">'
      + '<div style="position:absolute;top:-30px;right:24px;font-size:150px;font-weight:700;color:rgba(255,255,255,.14);line-height:1;">' + esc(proj.label) + '</div>'
      + '<div><div style="font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.7);margin-bottom:6px;">' + esc(proj.year) + '</div>'
      + '<div style="font-size:30px;font-weight:700;color:#fff;letter-spacing:-.5px;text-shadow:0 2px 12px rgba(0,0,0,.3);">' + esc(proj.full) + '</div></div></div>'
      + '<div style="max-width:800px;margin:0 auto;padding:30px 40px 60px;">'
      + '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px;">' + tagsHtml + '</div>'
      + descHtml
      + projectDiagramBlock(proj)
      + '<div style="font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:rgba(236,231,225,.5);margin:30px 0 14px;">Highlights</div>'
      + '<div style="display:flex;flex-direction:column;gap:11px;margin-bottom:32px;">' + highlightsHtml + '</div>'
      + linksHtml + '</div></div>';
  }

  function afterRender() {
    if (state.active === 'terminal') {
      var body = document.getElementById('term-body');
      if (body) body.scrollTop = body.scrollHeight;
      var inp = document.getElementById('term-input');
      if (inp) { inp.focus(); var v = inp.value; inp.value = ''; inp.value = v; }
    }
    if (state.overview) {
      var s = document.getElementById('search-input');
      if (s) { s.focus(); var sv = s.value; s.value = ''; s.value = sv; }
    }
  }

  // Files-view item click dispatch (avoids re-serializing closures into HTML attrs)
  function filesOpen(i) {
    var items = window.__filesItems || [];
    if (items[i] && items[i].open) items[i].open();
  }

  // ---------------------------------------------------------------------
  // Boot + clock + global key handling
  // ---------------------------------------------------------------------
  function startBoot() {
    bootId = setInterval(function () {
      if (state.boot >= 100) return;
      var n = Math.min(100, state.boot + 6 + Math.random() * 11);
      if (n >= 100) {
        clearInterval(bootId);
        setTimeout(function () {
          setState({ booted: true, hint: true });
          setTimeout(function () { if (state.hint) setState({ hint: false }); }, 9000);
        }, 700);
      }
      setState({ boot: n });
    }, 130);
  }
  function dismissHint() { setState({ hint: false }); }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (state.ctx.open) { setState({ ctx: { open: false, x: 0, y: 0 } }); return; }
      if (state.help) { setState({ help: false }); return; }
      if (state.overview) { setState({ overview: false }); return; }
      if (state.active) { setState({ active: null }); return; }
    }
  });

  // ---------------------------------------------------------------------
  // Public API (referenced by inline event handlers)
  // ---------------------------------------------------------------------
  window.App = {
    open: open, openPost: openPost, blogBack: blogBack,
    toggleOverview: toggleOverview, closeOverview: closeOverview, closeWindow: closeWindow,
    toggleHelp: toggleHelp, closeHelp: closeHelp, dismissHint: dismissHint,
    setFiles: setFiles, setWall: setWall,
    onDeskContext: onDeskContext, onDeskClick: onDeskClick,
    onSearchInput: onSearchInput, onSearchKey: onSearchKey,
    onTermInput: onTermInput, onTermKey: onTermKey, focusTerm: focusTerm,
    stop: stop, filesOpen: filesOpen,
    iconFailed: function (url) { brokenIcons[url] = true; }
  };

  tick();
  clockId = setInterval(tick, 15000);
  startBoot();
  loadContent();
  render();
})();
</script>
</body>
</html>
